[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ducktalk"
version = "1.0.0"
description = "DuckTalk: direct, ephemeral, end-to-end encrypted peer-to-peer chat. No relay servers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DuckTalk contributors" }]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ducktalk = "ducktalk.cli:main"

[tool.setuptools.packages.find]
include = ["ducktalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]
